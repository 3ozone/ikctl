openapi: 3.1.0
info:
  title: ikctl API
  description: API REST para gestión de instalaciones remotas de aplicaciones
  version: 1.0.0
paths:
  /:
    get:
      summary: Read Root
      description: Endpoint raíz — información básica de la API.
      operationId: read_root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      summary: Healthz
      description: Kubernetes liveness probe — verifica que el proceso está vivo.
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      summary: Readyz
      description: Kubernetes readiness probe — verifica que la app está lista para
        recibir tráfico.
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Registrar usuario
      description: Crea una cuenta nueva. Devuelve el user_id y un mensaje indicando
        que se debe verificar el email.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/verify-email:
    post:
      tags:
      - auth
      summary: Verificar email
      description: Verifica el email del usuario usando el token recibido por correo.
      operationId: verify_email_api_v1_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/resend-verification:
    post:
      tags:
      - auth
      summary: Reenviar email de verificación
      description: Genera un nuevo token y reenvía el email de verificación al usuario.
      operationId: resend_verification_api_v1_auth_resend_verification_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Autentica al usuario con email y contraseña. Si tiene 2FA activo
        devuelve requires_2fa=true.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login/github:
    post:
      tags:
      - auth
      summary: Iniciar autenticación GitHub OAuth
      description: Genera la URL de autorización de GitHub para iniciar el flujo OAuth.
      operationId: login_github_api_v1_auth_login_github_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAuthResponse'
  /api/v1/auth/login/github/callback:
    get:
      tags:
      - auth
      summary: Callback GitHub OAuth
      description: Intercambia el código de GitHub por tokens JWT y autentica al usuario.
      operationId: login_github_callback_api_v1_auth_login_github_callback_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login/2fa:
    post:
      tags:
      - auth
      summary: Completar login con 2FA
      description: Verifica el código TOTP y devuelve tokens si es correcto.
      operationId: login_2fa_api_v1_auth_login_2fa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login2FARequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Renovar access token
      description: Genera un nuevo access token usando un refresh token válido.
      operationId: refresh_api_v1_auth_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Cerrar sesión
      description: Revoca el refresh token e invalida la sesión del usuario.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/password/forgot:
    post:
      tags:
      - auth
      summary: Solicitar reset de contraseña
      description: Envía un email con enlace de reset de contraseña. Siempre responde
        200 por seguridad.
      operationId: forgot_password_api_v1_auth_password_forgot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/password/reset:
    post:
      tags:
      - auth
      summary: Confirmar reset de contraseña
      description: Valida el token de reset y actualiza la contraseña del usuario.
      operationId: reset_password_api_v1_auth_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/users/me:
    get:
      tags:
      - auth
      summary: Obtener perfil del usuario
      description: Devuelve los datos del perfil del usuario autenticado.
      operationId: get_profile_api_v1_auth_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    put:
      tags:
      - auth
      summary: Actualizar perfil del usuario
      description: Actualiza el nombre del usuario autenticado y devuelve el perfil
        actualizado.
      operationId: update_profile_api_v1_auth_users_me_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - auth
      summary: Eliminar cuenta
      description: Elimina permanentemente la cuenta del usuario autenticado (GDPR
        - derecho al olvido).
      operationId: delete_account_api_v1_auth_users_me_delete
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/users/me/password:
    put:
      tags:
      - auth
      summary: Cambiar contraseña
      description: Cambia la contraseña del usuario autenticado. Requiere la contraseña
        actual.
      operationId: change_password_api_v1_auth_users_me_password_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/users/me/2fa/enable:
    post:
      tags:
      - auth
      summary: Iniciar setup de 2FA
      description: Genera un secret TOTP y QR code para configurar 2FA en el usuario
        autenticado.
      operationId: enable_2fa_api_v1_auth_users_me_2fa_enable_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetupResponse'
  /api/v1/auth/users/me/2fa/verify:
    post:
      tags:
      - auth
      summary: Verificar código TOTP
      description: Verifica un código TOTP de 6 dígitos para confirmar el setup 2FA.
      operationId: verify_2fa_api_v1_auth_users_me_2fa_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enable2FAVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/users/me/2fa/disable:
    post:
      tags:
      - auth
      summary: Deshabilitar 2FA
      description: Deshabilita 2FA del usuario autenticado. Requiere código TOTP válido.
      operationId: disable_2fa_api_v1_auth_users_me_2fa_disable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disable2FARequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/users/me/data:
    get:
      tags:
      - auth
      summary: Exportar datos personales
      description: Devuelve todos los datos personales del usuario autenticado (GDPR
        - derecho de acceso).
      operationId: export_user_data_api_v1_auth_users_me_data_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
  /api/v1/credentials:
    post:
      tags:
      - credentials
      summary: Create Credential
      description: "Crea una nueva credencial de acceso para el usuario autenticado.\n\
        \nReturns:\n    201 CredentialResponse — sin password ni private_key.\n\n\
        Raises:\n    400 si el tipo o la configuración son inválidos."
      operationId: create_credential_api_v1_credentials_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - credentials
      summary: List Credentials
      description: "Lista las credenciales del usuario autenticado con paginación.\n\
        \nReturns:\n    200 CredentialListResponse — lista paginada sin password ni\
        \ private_key."
      operationId: list_credentials_api_v1_credentials_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Número de página (1-based)
          default: 1
          title: Page
        description: Número de página (1-based)
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Elementos por página
          default: 20
          title: Per Page
        description: Elementos por página
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/credentials/{credential_id}:
    get:
      tags:
      - credentials
      summary: Get Credential
      description: "Obtiene una credencial por su ID.\n\nReturns:\n    200 CredentialResponse\
        \ — sin password ni private_key.\n\nRaises:\n    404 si la credencial no existe\
        \ o no pertenece al usuario."
      operationId: get_credential_api_v1_credentials__credential_id__get
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          title: Credential Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - credentials
      summary: Update Credential
      description: "Actualiza una credencial existente del usuario autenticado.\n\n\
        Returns:\n    200 CredentialResponse — sin password ni private_key.\n\nRaises:\n\
        \    404 si la credencial no existe o no pertenece al usuario.\n    403 si\
        \ el usuario no tiene permiso para actualizar la credencial."
      operationId: update_credential_api_v1_credentials__credential_id__put
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          title: Credential Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - credentials
      summary: Delete Credential
      description: "Elimina una credencial del usuario autenticado.\n\nReturns:\n\
        \    204 sin body.\n\nRaises:\n    404 si la credencial no existe o no pertenece\
        \ al usuario.\n    409 si la credencial está en uso por algún servidor."
      operationId: delete_credential_api_v1_credentials__credential_id__delete
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          title: Credential Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/servers:
    post:
      tags:
      - servers
      summary: Create Server
      description: "Registra un nuevo servidor remoto o local según el campo `type`.\n\
        \n- `type=remote` (por defecto): requiere `host`, `port` y `credential_id`.\n\
        - `type=local`: solo requiere `name`. Solo usuarios con rol `admin` pueden\
        \ crearlo.\n\nEl campo `type` es opcional: si no se envía se asume \"remote\"\
        .\n\nReturns:\n    201 ServerResponse con los datos del servidor creado.\n\
        \nRaises:\n    400 si la configuración es inválida.\n    403 si un usuario\
        \ no-admin intenta crear un servidor local.\n    404 si la credencial no existe.\n\
        \    409 si ya existe un servidor local para el usuario."
      operationId: create_server_api_v1_servers_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_CreateServerUnifiedBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - servers
      summary: List Servers
      description: "Lista los servidores del usuario autenticado con paginación.\n\
        \nReturns:\n    200 ServerListResponse — lista paginada de servidores."
      operationId: list_servers_api_v1_servers_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Número de página (1-based)
          default: 1
          title: Page
        description: Número de página (1-based)
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Elementos por página
          default: 20
          title: Per Page
        description: Elementos por página
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/servers/{server_id}:
    get:
      tags:
      - servers
      summary: Get Server
      description: "Obtiene un servidor por su ID.\n\nReturns:\n    200 ServerResponse.\n\
        \nRaises:\n    404 si el servidor no existe o no pertenece al usuario."
      operationId: get_server_api_v1_servers__server_id__get
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - servers
      summary: Update Server
      description: "Actualiza un servidor existente del usuario autenticado.\n\nReturns:\n\
        \    200 ServerResponse con los datos actualizados.\n\nRaises:\n    404 si\
        \ el servidor no existe o no pertenece al usuario."
      operationId: update_server_api_v1_servers__server_id__put
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - servers
      summary: Delete Server
      description: "Elimina un servidor del usuario autenticado.\n\nReturns:\n   \
        \ 204 sin body.\n\nRaises:\n    404 si el servidor no existe o no pertenece\
        \ al usuario.\n    409 si el servidor tiene operaciones activas."
      operationId: delete_server_api_v1_servers__server_id__delete
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/servers/{server_id}/toggle:
    post:
      tags:
      - servers
      summary: Toggle Server Status
      description: "Activa o desactiva un servidor del usuario autenticado.\n\nReturns:\n\
        \    200 ServerResponse con el estado actualizado.\n\nRaises:\n    404 si\
        \ el servidor no existe o no pertenece al usuario."
      operationId: toggle_server_status_api_v1_servers__server_id__toggle_post
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleServerStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/servers/{server_id}/health:
    get:
      tags:
      - servers
      summary: Check Server Health
      description: "Verifica la conectividad SSH y detecta el SO del servidor.\n\n\
        Returns:\n    200 HealthCheckResponse con status online/offline, latency_ms\
        \ y OS info.\n\nRaises:\n    404 si el servidor no existe o no pertenece al\
        \ usuario."
      operationId: check_server_health_api_v1_servers__server_id__health_get
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/servers/{server_id}/command:
    post:
      tags:
      - servers
      summary: Execute Command
      description: "Ejecuta un comando ad-hoc en el servidor indicado.\n\nReturns:\n\
        \    200 AdHocCommandResponse con stdout, stderr y exit_code.\n\nRaises:\n\
        \    404 si el servidor no existe o no pertenece al usuario."
      operationId: execute_command_api_v1_servers__server_id__command_post
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocCommandRequest'
      responses:
        '200':
