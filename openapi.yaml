          anyOf:
          - type: string
          - type: 'null'
          title: Credential Id
          examples:
          - cred-uuid
        description:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Description
      type: object
      required:
      - name
      title: _CreateServerUnifiedBody
