        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 50
          title: Per Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineExecutionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pipelines/{pipeline_id}/executions/{execution_id}:
    get:
      tags:
      - pipelines
      summary: Get Pipeline Execution Detail
      description: "Obtiene el detalle completo de una ejecución de pipeline.\n\n\
        Incluye snapshot inmutable y lista de operaciones individuales.\n\nReturns:\n\
        \    200 PipelineExecutionDetailResponse.\n\nRaises:\n    404: Si el pipeline\
        \ o la ejecución no existen, o no pertenecen al usuario."
      operationId: get_pipeline_execution_detail_api_v1_pipelines__pipeline_id__executions__execution_id__get
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          title: Pipeline Id
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          title: Execution Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineExecutionDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pipelines/{pipeline_id}/executions/{execution_id}/cancel:
    post:
      tags:
      - pipelines
      summary: Cancel Pipeline Execution
      description: "Cancela una ejecución de pipeline en estado in_progress.\n\nReturns:\n\
        \    200 PipelineExecutionCancelResponse con el estado actualizado.\n\nRaises:\n\
        \    404: Si el pipeline no existe o no pertenece al usuario.\n    422: Si\
        \ la ejecución no está en estado cancelable (pending o terminal)."
      operationId: cancel_pipeline_execution_api_v1_pipelines__pipeline_id__executions__execution_id__cancel_post
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          title: Pipeline Id
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          title: Execution Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineExecutionCancelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
